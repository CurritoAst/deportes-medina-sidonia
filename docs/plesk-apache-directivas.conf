# ==========================================================================
# Directivas de Apache para Plesk — defensa en profundidad
# Pegar en: Websites & Domains → <dominio> → Apache & nginx Settings →
#           "Additional Apache directives" (en las cajas de HTTP y de HTTPS).
#
# POR QUÉ: con Passenger en Plesk, Apache sirve directamente los ficheros que
# EXISTEN en el document root ANTES de pasar la petición a Node. La lista
# blanca de server.js solo actúa si la petición llega a Node, así que hay que
# cerrar también en Apache lo sensible que viaja en el repo.
# Mantener la lista "sin huecos": el panel del torno, los docs, el código del
# servidor, la config del torno, .git, node_modules.
# ==========================================================================

# Código de servidor y configuración
<FilesMatch "^(server\.js|almacen\.js|package\.json|package-lock\.json|render\.yaml|\.gitignore|\.gitattributes)$">
    Require all denied
</FilesMatch>

# Documentación interna (.md) y ficheros de entorno
<FilesMatch "\.(md|env|sql|log)$">
    Require all denied
</FilesMatch>

# Carpetas que nunca deben servirse por web
<DirectoryMatch "/(acceso|data|docs|node_modules|test|migraciones|scripts|lib|\.git)(/|$)">
    Require all denied
</DirectoryMatch>

# Scripts de prueba/demo que no forman parte de la web
<FilesMatch "^(demo\.js|qr-prueba\.js|qr-prueba\.html)$">
    Require all denied
</FilesMatch>

# Una sola instancia de Passenger (ya aplicado; se deja aquí como referencia)
PassengerMinInstances 1
PassengerForceMaxConcurrentRequestsPerProcess 0
